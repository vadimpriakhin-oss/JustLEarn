<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>JustLEarn — Offline</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1d1d1d, #2e2e2e);
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
            font-size: 2rem;
            margin-bottom: 12px;
        }
        p {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 24px;
            max-width: 320px;
        }
        button {
            background: linear-gradient(45deg, #ff007f, #ff7f00);
            border: none;
            border-radius: 5px;
            color: white;
            padding: 12px 28px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <h1>JustLEarn</h1>
    <p>You appear to be offline. Please check your internet connection and try again.</p>
    <button onclick="window.location.reload()">Retry</button>
</body>
</html>
