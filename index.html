<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>JustLEarn</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- Theme color for browser chrome -->
    <meta name="theme-color" content="#00ffcc">

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="JustLEarn">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">

    <!-- App description for search engines / stores -->
    <meta name="description" content="Interactive learning app with True/False, Multiple Choice, Fill in the Blank, and Drag & Drop quiz modes.">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Home Page -->
        <div class="home-page" id="homePage">
            <div class="neon-logo">
                <h1>JustLEarn</h1>
            </div>
            <p class="subtitle">Learn Your Way</p>
            
            <div class="learning-modes">
                <button class="mode-btn" data-mode="truefalse" id="trueFalseBtn">
                    <div class="mode-icon">✓✗</div>
                    <div class="mode-title">True or False</div>
                </button>
                
                <button class="mode-btn" data-mode="multichoice" id="multiChoiceBtn">
                    <div class="mode-icon">◯</div>
                    <div class="mode-title">Multiple Choice</div>
                </button>
                
                <button class="mode-btn" data-mode="fillblank" id="fillBlankBtn">
                    <div class="mode-icon">_</div>
                    <div class="mode-title">Fill in the Blank</div>
                </button>
                
                <button class="mode-btn" data-mode="draganddrop" id="dragDropBtn">
                    <div class="mode-icon">⇄</div>
                    <div class="mode-title">Drag & Drop</div>
                </button>
                
                <button class="mode-btn" data-mode="addterm" id="addTermHomeBtn">
                    <div class="mode-icon">➕</div>
                    <div class="mode-title">Add Custom Term</div>
                </button>
            </div>
        </div>
        
        <!-- Create Mode Selection Page -->
        <div class="create-mode-selection hidden" id="createModeSelectionPage">
            <div class="neon-logo">
                <h1>JustLEarn</h1>
            </div>
            
            <h2>How would you like to add terms?</h2>
            
            <div class="mode-selection-buttons">
                <button class="mode-option" data-create-mode="single" id="singleTermBtn">
                    <div class="mode-icon">📝</div>
                    <div class="mode-title">Single Term</div>
                    <div class="mode-desc">Add one term with its answer</div>
                </button>
                
                <button class="mode-option" data-create-mode="batch" id="batchModeBtn">
                    <div class="mode-icon">📚</div>
                    <div class="mode-title">Batch Mode</div>
                    <div class="mode-desc">Add multiple terms at once</div>
                </button>
                
                <button class="mode-option" data-create-mode="import" id="importFileBtn">
                    <div class="mode-icon">📤</div>
                    <div class="mode-title">Import from File</div>
                    <div class="mode-desc">Upload or paste terms</div>
                </button>
            </div>
            
            <button id="backFromModeBtn" class="btn-secondary">Back to Home</button>
        </div>
        
        <!-- Add Term Page -->
        <div class="add-term-page hidden" id="addTermPage">
            <div class="neon-logo">
                <h1>JustLEarn</h1>
            </div>
            
            <h2>Add Custom Term</h2>
            
            <div class="form-group">
                <label for="termInput">Term:</label>
                <input type="text" id="termInput" class="form-input" placeholder="Enter the term...">
            </div>
            
            <div class="form-group">
                <label for="answerInput">Answer:</label>
                <input type="text" id="answerInput" class="form-input" placeholder="Enter the answer...">
            </div>
            
            <div class="button-group">
                <button id="addBtn" class="btn-primary">Add Term</button>
                <button id="backBtn" class="btn-secondary">Back to Home</button>
            </div>
            
            <div id="customTermsList" class="terms-list">
                <h3>Your Custom Terms:</h3>
                <ul id="termsList"></ul>
            </div>
        </div>
        
        <!-- Quiz Page -->
        <div class="quiz-page hidden" id="quizPage">
            <div class="quiz-header">
                <div class="score-counter">
                    <span class="score-label">Score:</span>
                    <span id="score" class="score-value">0</span>
                </div>
                <h2 id="modeTitle" class="mode-header">Quiz</h2>
                <div class="progress-bar">
                    <div id="progress" class="progress-fill"></div>
                </div>
            </div>
            
            <div id="quizContent"></div>
            
            <div class="quiz-buttons">
                <button id="nextBtn" class="btn-primary hidden">Next</button>
                <button id="homeBtn" class="btn-secondary">Back to Home</button>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
    <script>
        // Register Service Worker for PWA / offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
                    .then((registration) => {
                        // Check for updates every time the page loads
                        registration.update();
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            if (newWorker) {
                                newWorker.addEventListener('statechange', () => {
                                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                        // New version available — notify user instead of force-reloading
                                        console.info('JustLEarn: A new version is available. Refresh the page to update.');
                                    }
                                });
                            }
                        });
                    })
                    .catch((err) => console.warn('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
