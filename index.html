<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JustLEarn - Your Study Sets</title>

  <!-- Favicon: SVG для современных браузеров -->
  <link rel="icon" type="image/svg+xml" href="logo.svg">

  <!-- Favicon: PNG fallback для Safari и старых браузеров -->
  <link rel="alternate icon" type="image/png" href="logo.svg">

  <!-- Apple Touch Icon для iOS (добавление на домашний экран) -->
  <link rel="apple-touch-icon" href="logo.svg">

  <!-- PWA мета-теги для Safari/iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="JustLEarn">

  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0a">
</head>
<body>
  <div id="splash-screen">
    <div id="splash-logo">JustLEarn</div>
  </div>
  <main id="app"></main>
  <script src="app.js"></script>
</body>
</html>
