<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16c784;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1024" height="1024" rx="160" fill="url(#bg)"/>
  <!-- Book shape -->
  <rect x="192" y="240" width="640" height="544" rx="24" fill="url(#accent)" opacity="0.15"/>
  <rect x="192" y="240" width="312" height="544" rx="16" fill="url(#accent)" opacity="0.9"/>
  <rect x="520" y="240" width="312" height="544" rx="16" fill="url(#accent)" opacity="0.7"/>
  <!-- Spine -->
  <rect x="496" y="240" width="32" height="544" fill="url(#bg)"/>
  <!-- Text lines on left page -->
  <rect x="232" y="320" width="192" height="16" rx="8" fill="#1a1a2e" opacity="0.7"/>
  <rect x="232" y="360" width="232" height="12" rx="6" fill="#1a1a2e" opacity="0.5"/>
  <rect x="232" y="392" width="208" height="12" rx="6" fill="#1a1a2e" opacity="0.5"/>
  <rect x="232" y="424" width="240" height="12" rx="6" fill="#1a1a2e" opacity="0.5"/>
  <rect x="232" y="456" width="192" height="12" rx="6" fill="#1a1a2e" opacity="0.5"/>
  <rect x="232" y="520" width="232" height="12" rx="6" fill="#1a1a2e" opacity="0.5"/>
  <rect x="232" y="552" width="208" height="12" rx="6" fill="#1a1a2e" opacity="0.5"/>
  <rect x="232" y="584" width="160" height="12" rx="6" fill="#1a1a2e" opacity="0.5"/>
  <!-- Letter J on right page -->
  <text x="584" y="600" font-family="Arial, sans-serif" font-size="240" font-weight="bold" fill="#1a1a2e" opacity="0.9" text-anchor="middle">J</text>
  <!-- Star/learn accent -->
  <circle cx="760" cy="300" r="36" fill="#16c784"/>
  <text x="760" y="314" font-family="Arial, sans-serif" font-size="44" fill="#1a1a2e" text-anchor="middle">★</text>
</svg>
