<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16c784;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Book shape -->
  <rect x="96" y="120" width="320" height="272" rx="12" fill="url(#accent)" opacity="0.15"/>
  <rect x="96" y="120" width="156" height="272" rx="8" fill="url(#accent)" opacity="0.9"/>
  <rect x="260" y="120" width="156" height="272" rx="8" fill="url(#accent)" opacity="0.7"/>
  <!-- Spine -->
  <rect x="248" y="120" width="16" height="272" fill="url(#bg)"/>
  <!-- Text lines on left page -->
  <rect x="116" y="160" width="96" height="8" rx="4" fill="#1a1a2e" opacity="0.7"/>
  <rect x="116" y="180" width="116" height="6" rx="3" fill="#1a1a2e" opacity="0.5"/>
  <rect x="116" y="196" width="104" height="6" rx="3" fill="#1a1a2e" opacity="0.5"/>
  <rect x="116" y="212" width="120" height="6" rx="3" fill="#1a1a2e" opacity="0.5"/>
  <rect x="116" y="228" width="96" height="6" rx="3" fill="#1a1a2e" opacity="0.5"/>
  <rect x="116" y="260" width="116" height="6" rx="3" fill="#1a1a2e" opacity="0.5"/>
  <rect x="116" y="276" width="104" height="6" rx="3" fill="#1a1a2e" opacity="0.5"/>
  <rect x="116" y="292" width="80" height="6" rx="3" fill="#1a1a2e" opacity="0.5"/>
  <!-- Letter J on right page -->
  <text x="292" y="300" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#1a1a2e" opacity="0.9" text-anchor="middle">J</text>
  <!-- Star/learn accent -->
  <circle cx="380" cy="150" r="18" fill="#16c784"/>
  <text x="380" y="157" font-family="Arial, sans-serif" font-size="22" fill="#1a1a2e" text-anchor="middle">★</text>
</svg>
