<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 720" width="540" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16c784;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="540" height="720" fill="url(#bg)"/>
  <!-- Status bar -->
  <rect width="540" height="40" fill="#16213e"/>
  <!-- Header -->
  <rect width="540" height="60" y="40" fill="#0f3460"/>
  <text x="270" y="81" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#16c784" text-anchor="middle">JustLEarn</text>
  <!-- Quiz card -->
  <rect x="20" y="120" width="500" height="200" rx="16" fill="#16213e"/>
  <text x="270" y="155" font-family="Arial, sans-serif" font-size="18" fill="#8892b0" text-anchor="middle">Question 1 of 20</text>
  <text x="270" y="200" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">"To acquire knowledge"</text>
  <text x="270" y="235" font-family="Arial, sans-serif" font-size="20" fill="#ccd6f6" text-anchor="middle">means to...</text>
  <!-- Answer options -->
  <rect x="20" y="340" width="240" height="60" rx="12" fill="#16c784" opacity="0.2"/>
  <text x="140" y="377" font-family="Arial, sans-serif" font-size="16" fill="#16c784" text-anchor="middle">A) Learn</text>
  <rect x="280" y="340" width="240" height="60" rx="12" fill="#16213e"/>
  <text x="400" y="377" font-family="Arial, sans-serif" font-size="16" fill="#8892b0" text-anchor="middle">B) Forget</text>
  <rect x="20" y="420" width="240" height="60" rx="12" fill="#16213e"/>
  <text x="140" y="457" font-family="Arial, sans-serif" font-size="16" fill="#8892b0" text-anchor="middle">C) Teach</text>
  <rect x="280" y="420" width="240" height="60" rx="12" fill="#16213e"/>
  <text x="400" y="457" font-family="Arial, sans-serif" font-size="16" fill="#8892b0" text-anchor="middle">D) Review</text>
  <!-- Progress bar -->
  <rect x="20" y="520" width="500" height="8" rx="4" fill="#16213e"/>
  <rect x="20" y="520" width="100" height="8" rx="4" fill="#16c784"/>
  <text x="270" y="570" font-family="Arial, sans-serif" font-size="14" fill="#8892b0" text-anchor="middle">5/20 correct • Keep going!</text>
</svg>
